<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100" preserveAspectRatio="xMidYMid meet">
  <!--
    corner: угловой «кирпич». Большая 8-конечная розетка в центре + 4 лозовых
    «уса», выходящих в стороны полос и связывающих угол с горизонталью и
    вертикалью. SVG симметричен по 4 осям — один файл во все 4 угла.
  -->
  <defs>
    <g id="corner-rose">
      <circle r="40" fill="#efe5ce"/>
      <circle r="40" fill="none" stroke="#c8983e" stroke-width="2.2"/>
      <circle r="36.6" fill="none" stroke="#8b6a2a" stroke-width="0.6" opacity="0.75"/>
      <circle r="33" fill="#e1b6a4"/>

      <g fill="#3a6c4f" stroke="#23402c" stroke-width="0.6" stroke-linejoin="round">
        <path d="M0 -28 C 7 -15, 7 -8, 0 0 C -7 -8, -7 -15, 0 -28 Z"/>
        <path d="M0 28  C 7 15,  7 8,  0 0 C -7 8,  -7 15,  0 28  Z"/>
        <path d="M-28 0 C -15 -7, -8 -7, 0 0 C -8 7, -15 7, -28 0 Z"/>
        <path d="M28 0  C 15 -7,  8 -7,  0 0 C 8 7,   15 7,  28 0  Z"/>
      </g>
      <g fill="#23402c" stroke="#0d1e14" stroke-width="0.45" stroke-linejoin="round" opacity="0.92" transform="rotate(45)">
        <path d="M0 -22 C 5 -12, 5 -6, 0 0 C -5 -6, -5 -12, 0 -22 Z"/>
        <path d="M0 22  C 5 12,  5 6,  0 0 C -5 6,  -5 12,  0 22  Z"/>
        <path d="M-22 0 C -12 -5, -6 -5, 0 0 C -6 5, -12 5, -22 0 Z"/>
        <path d="M22 0  C 12 -5,  6 -5,  0 0 C 6 5,   12 5,  22 0  Z"/>
      </g>

      <g fill="#447a86" stroke="#1f4750" stroke-width="0.5">
        <path d="M16 16 C 19 19, 19 22, 16 22 C 13 19, 13 19, 16 16 Z"/>
        <path d="M-16 16 C -19 19, -19 22, -16 22 C -13 19, -13 19, -16 16 Z"/>
        <path d="M-16 -16 C -19 -19, -19 -22, -16 -22 C -13 -19, -13 -19, -16 -16 Z"/>
        <path d="M16 -16 C 19 -19, 19 -22, 16 -22 C 13 -19, 13 -19, 16 -16 Z"/>
      </g>

      <circle r="6.4" fill="#a82820" stroke="#6a1612" stroke-width="0.55"/>
      <circle r="2.4" fill="#efe5ce"/>

      <g fill="#efe5ce" stroke="#8b6a2a" stroke-width="0.45">
        <circle cx="0" cy="-36" r="1.5"/>
        <circle cx="0" cy="36"  r="1.5"/>
        <circle cx="-36" cy="0" r="1.5"/>
        <circle cx="36" cy="0"  r="1.5"/>
        <circle cx="25.5" cy="25.5" r="1.1"/>
        <circle cx="-25.5" cy="25.5" r="1.1"/>
        <circle cx="-25.5" cy="-25.5" r="1.1"/>
        <circle cx="25.5" cy="-25.5" r="1.1"/>
      </g>
    </g>

    <!-- Лозовый «ус», выходящий из розетки в сторону полосы. -->
    <g id="corner-vine">
      <!-- арка лозы -->
      <path d="M0 0 C 5 -3, 12 -3, 15 0" fill="none" stroke="#c8983e" stroke-width="1.4"/>
      <path d="M0 0 C 5 3, 12 3, 15 0"  fill="none" stroke="#c8983e" stroke-width="1.4"/>
      <!-- листик-миндалина в центре -->
      <g transform="translate(7.5 0)">
        <path d="M-2.5 0 C -1.5 -2, 1.5 -2, 2.5 0 C 1.5 2, -1.5 2, -2.5 0 Z" fill="#e1b6a4" stroke="#8b6a2a" stroke-width="0.35"/>
        <circle r="0.9" fill="#a82820"/>
      </g>
      <!-- жемчужины -->
      <circle cx="3"  cy="0" r="0.9" fill="#447a86" stroke="#1f4750" stroke-width="0.25"/>
      <circle cx="12" cy="0" r="0.9" fill="#447a86" stroke="#1f4750" stroke-width="0.25"/>
    </g>
  </defs>

  <rect width="100" height="100" fill="#efe5ce"/>

  <rect x="0"     y="0"     width="100"  height="6.25" fill="#c8983e"/>
  <rect x="0"     y="93.75" width="100"  height="6.25" fill="#c8983e"/>
  <rect x="0"     y="0"     width="6.25" height="100"  fill="#c8983e"/>
  <rect x="93.75" y="0"     width="6.25" height="100"  fill="#c8983e"/>
  <g stroke="#8b6a2a" stroke-width="0.55">
    <line x1="0"    y1="7.1"  x2="100" y2="7.1"/>
    <line x1="0"    y1="92.9" x2="100" y2="92.9"/>
    <line x1="7.1"  y1="0"    x2="7.1"  y2="100"/>
    <line x1="92.9" y1="0"    x2="92.9" y2="100"/>
  </g>

  <!-- 4 лозовых уса от розетки к каёмке (12, 3, 6, 9 часов) -->
  <use href="#corner-vine" transform="translate(50 10) rotate(90)"/>
  <use href="#corner-vine" transform="translate(90 50) rotate(180)"/>
  <use href="#corner-vine" transform="translate(50 90) rotate(-90)"/>
  <use href="#corner-vine" transform="translate(10 50)"/>

  <!-- Центральная розетка -->
  <use href="#corner-rose" x="50" y="50"/>
</svg>
