<svg xmlns="http://www.w3.org/2000/svg" width="80" height="240" viewBox="0 0 80 240" preserveAspectRatio="xMidYMid meet">
  <!--
    tile-v: вертикальный двойник tile-h. Период 80×240.
    Композиция: [бумага · узел · мост · розетка · мост · узел · бумага].
    Узлы внутри тайла (y=30, y=210); по краям — чистая бумага. При repeat-y
    между узлами соседних тайлов остаётся бумажный воздух — узор не
    задваивается на стыке.
  -->
  <defs>
    <g id="rosette-v">
      <circle r="32" fill="#efe5ce"/>
      <circle r="32" fill="none" stroke="#c8983e" stroke-width="2"/>
      <circle r="29" fill="none" stroke="#8b6a2a" stroke-width="0.55" opacity="0.75"/>
      <circle r="26" fill="#e1b6a4"/>
      <g fill="#3a6c4f" stroke="#23402c" stroke-width="0.55" stroke-linejoin="round">
        <path d="M0 -22 C 5.5 -12, 5.5 -6, 0 0 C -5.5 -6, -5.5 -12, 0 -22 Z"/>
        <path d="M0 22  C 5.5 12,  5.5 6,  0 0 C -5.5 6,  -5.5 12,  0 22  Z"/>
        <path d="M-22 0 C -12 -5.5, -6 -5.5, 0 0 C -6 5.5, -12 5.5, -22 0 Z"/>
        <path d="M22 0  C 12 -5.5,  6 -5.5,  0 0 C 6 5.5,   12 5.5,  22 0  Z"/>
      </g>
      <g fill="#23402c" stroke="#0d1e14" stroke-width="0.4" opacity="0.9" transform="rotate(45)">
        <path d="M0 -14 C 3 -8, 3 -4, 0 0 C -3 -4, -3 -8, 0 -14 Z"/>
        <path d="M0 14  C 3 8,  3 4,  0 0 C -3 4,  -3 8,  0 14  Z"/>
        <path d="M-14 0 C -8 -3, -4 -3, 0 0 C -4 3, -8 3, -14 0 Z"/>
        <path d="M14 0  C 8 -3,  4 -3,  0 0 C 4 3,   8 3,  14 0  Z"/>
      </g>
      <g fill="#447a86" stroke="#1f4750" stroke-width="0.45">
        <path d="M11 11 C 14 14, 14 17, 11 17 C 8 14, 8 14, 11 11 Z"/>
        <path d="M-11 11 C -14 14, -14 17, -11 17 C -8 14, -8 14, -11 11 Z"/>
        <path d="M-11 -11 C -14 -14, -14 -17, -11 -17 C -8 -14, -8 -14, -11 -11 Z"/>
        <path d="M11 -11 C 14 -14, 14 -17, 11 -17 C 8 -14, 8 -14, 11 -11 Z"/>
      </g>
      <circle r="5.4" fill="#a82820" stroke="#6a1612" stroke-width="0.5"/>
      <circle r="2" fill="#efe5ce"/>
      <g fill="#efe5ce" stroke="#8b6a2a" stroke-width="0.4">
        <circle cx="0" cy="-28.5" r="1.3"/>
        <circle cx="0" cy="28.5"  r="1.3"/>
        <circle cx="-28.5" cy="0" r="1.3"/>
        <circle cx="28.5" cy="0"  r="1.3"/>
      </g>
    </g>

    <g id="node-v">
      <ellipse rx="20" ry="22" fill="#efe5ce"/>
      <ellipse rx="20" ry="22" fill="none" stroke="#c8983e" stroke-width="1.6"/>
      <ellipse rx="17.4" ry="19.2" fill="none" stroke="#8b6a2a" stroke-width="0.5" opacity="0.7"/>
      <g fill="#3a6c4f" stroke="#23402c" stroke-width="0.5" stroke-linejoin="round">
        <path d="M0 -16 C 4 -10, 4 -5, 0 0 C -4 -5, -4 -10, 0 -16 Z"/>
        <path d="M0 16  C 4 10,  4 5,  0 0 C -4 5,  -4 10,  0 16  Z"/>
        <path d="M-14 0 C -8 -4, -4 -4, 0 0 C -4 4, -8 4, -14 0 Z"/>
        <path d="M14 0  C 8 -4,  4 -4,  0 0 C 4 4,   8 4,  14 0  Z"/>
      </g>
      <g fill="#447a86" stroke="#1f4750" stroke-width="0.35">
        <circle cx="7" cy="7" r="1.8"/>
        <circle cx="-7" cy="7" r="1.8"/>
        <circle cx="-7" cy="-7" r="1.8"/>
        <circle cx="7" cy="-7" r="1.8"/>
      </g>
      <circle r="3.5" fill="#a82820" stroke="#6a1612" stroke-width="0.4"/>
      <circle r="1.4" fill="#efe5ce"/>
    </g>

    <g id="bridge-v">
      <path d="M0 0 C -8 9, -8 27, 0 36" fill="none" stroke="#c8983e" stroke-width="1.4"/>
      <path d="M0 0 C 8 9, 8 27, 0 36"  fill="none" stroke="#c8983e" stroke-width="1.4"/>
      <path d="M0 0 C -6 9, -6 27, 0 36" fill="none" stroke="#8b6a2a" stroke-width="0.4" opacity="0.65"/>
      <path d="M0 0 C 6 9, 6 27, 0 36"   fill="none" stroke="#8b6a2a" stroke-width="0.4" opacity="0.65"/>

      <g transform="translate(0 18)">
        <path d="M0 -5 C -4 -3, -4 3, 0 5 C 4 3, 4 -3, 0 -5 Z" fill="#e1b6a4" stroke="#8b6a2a" stroke-width="0.4"/>
        <circle r="1.3" fill="#a82820" stroke="#6a1612" stroke-width="0.3"/>
      </g>

      <g fill="#447a86" stroke="#1f4750" stroke-width="0.3">
        <circle cx="0" cy="7" r="1.1"/>
        <circle cx="0" cy="29" r="1.1"/>
      </g>

      <g fill="#c8983e">
        <circle cx="-7" cy="18" r="0.8"/>
        <circle cx="7"  cy="18" r="0.8"/>
      </g>
    </g>
  </defs>

  <rect width="80" height="240" fill="#efe5ce"/>

  <rect x="0"     y="0" width="6.25" height="240" fill="#c8983e"/>
  <rect x="73.75" y="0" width="6.25" height="240" fill="#c8983e"/>
  <line x1="7.1"  y1="0" x2="7.1"  y2="240" stroke="#8b6a2a" stroke-width="0.55"/>
  <line x1="72.9" y1="0" x2="72.9" y2="240" stroke="#8b6a2a" stroke-width="0.55"/>

  <use href="#bridge-v" x="40" y="52"/>
  <use href="#bridge-v" x="40" y="152"/>

  <use href="#rosette-v" x="40" y="120"/>

  <use href="#node-v" x="40" y="30"/>
  <use href="#node-v" x="40" y="210"/>
</svg>
